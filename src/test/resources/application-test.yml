# Perfil de test: base de datos H2 en memoria (modo MySQL para que data.sql funcione).
# Se activa con @ActiveProfiles("test") en los tests de integración.
spring:
  datasource:
    url: jdbc:h2:mem:escuela_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      continue-on-error: false

app:
  jwt:
    secret: secreto-de-pruebas-con-al-menos-32-caracteres-para-hs256
    expiration-ms: 3600000

logging:
  level:
    org.springframework.security: WARN
