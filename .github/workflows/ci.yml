name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si se empuja dos veces seguidas a la misma rama, cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build y tests (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Cachea ~/.m2/repository con la clave derivada del pom.xml
          cache: maven

      # Los tests no necesitan MySQL: los unitarios usan Mockito y los de
      # integración levantan H2 en memoria con el perfil `test`.
      - name: Compilar y correr la suite
        run: mvn -B -ntp verify

      - name: Resumen de la suite
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          from collections import defaultdict

          CLAVES = ("tests", "failures", "errors", "skipped")

          # Cada clase @Nested genera su propio XML; se suman bajo la clase padre
          # para que la tabla tenga una fila por suite y no una por bloque anidado.
          suites = defaultdict(lambda: [0, 0, 0, 0])
          for archivo in glob.glob("target/surefire-reports/*.xml"):
              raiz = ET.parse(archivo).getroot()
              clase = raiz.get("name", "").split(".")[-1].split("$")[0]
              for i, clave in enumerate(CLAVES):
                  suites[clase][i] += int(raiz.get(clave, 0))

          if not suites:
              print("No se generaron reportes de surefire.")
              raise SystemExit

          totales = [sum(c[i] for c in suites.values()) for i in range(4)]
          estado = "✅ verde" if totales[1] + totales[2] == 0 else "❌ con fallos"
          print(f"## Suite: {totales[0]} tests · {estado}\n")
          print("| Clase | Tests | Fallos | Errores | Omitidos |")
          print("|---|---:|---:|---:|---:|")
          for clase in sorted(suites):
              t, f, e, s = suites[clase]
              print(f"| `{clase}` | {t} | {f} | {e} | {s} |")
          print(f"| **Total** | **{totales[0]}** | **{totales[1]}** | **{totales[2]}** | **{totales[3]}** |")
          PY

      # Sin esto, un fallo en CI sólo deja el log; con los XML se puede ver
      # el stacktrace exacto de cada test que reventó.
      - name: Publicar reportes de surefire (sólo si algo falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publicar el jar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: school-management-api-jar
          path: target/*.jar
          retention-days: 7

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      # No se publica en ningún registro: sólo confirma que el Dockerfile
      # multi-etapa sigue compilando antes de llegar a un deploy.
      - name: Construir la imagen
        run: docker build -t school-management-api:${{ github.sha }} .
